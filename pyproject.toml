[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ushnotice"
version = "1.0.0"
description = "USHSPA Notification Microservice — event-driven, multi-channel, production-ready"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Data validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    # Database
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    # Redis
    "redis[hiredis]>=5.1.0",
    # HTTP client
    "httpx>=0.27.2",
    # AWS
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    # Templating
    "jinja2>=3.1.4",
    # Logging
    "structlog>=24.4.0",
    "python-json-logger>=2.0.7",
    # Utilities
    "python-dateutil>=2.9.0",
    "tenacity>=9.0.0",
    # Email (Gmail SMTP)
    "aiosmtplib>=3.0.1",
    "greenlet>=3.5.5",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",  # async test client
    "factory-boy>=3.3.1",
    "freezegun>=1.5.1",

    # Load testing
    "locust>=2.31.0",

    # Lint & type checking
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "types-python-dateutil>=2.9.0",
    "sqlalchemy[mypy]>=2.0.36",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["B008", "N818"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (no external dependencies)",
    "service: Service-level tests with mocked dependencies",
    "performance: Performance and load tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
